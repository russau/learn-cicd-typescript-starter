name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - uses: 'google-github-actions/auth@v3'
        with:
          service_account: cloud-run-deployer@ci-cd-github-docker-typescript.iam.gserviceaccount.com
          workload_identity_provider: projects/1005978040224/locations/global/workloadIdentityPools/github/providers/russau/learn-cicd-typescript-starter



      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build and push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/ci-cd-github-docker-typescript/notely-ar-repo/notely:latest .
